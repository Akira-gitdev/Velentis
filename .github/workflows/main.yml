name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get your files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Put the app files in place
        run: |
          mkdir -p www
          cp VELENTIS-index.html www/index.html
          cp VELENTIS-intro.html www/intro.html

      - name: Draw the app icon and start screen
        run: node VELENTIS-make-assets.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: Make every icon and start screen size
        run: npx capacitor-assets generate --android

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Velentis.apk

      - name: Keep a copy in the run
        uses: actions/upload-artifact@v4
        with:
          name: Velentis-apk
          path: Velentis.apk

      - name: Publish it on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Velentis build ${{ github.run_number }}
          files: Velentis.apk
