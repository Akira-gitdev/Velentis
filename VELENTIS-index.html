/* Layout: one phone-width column, a floating glass nav, and one skin (theme) applied through tokens. */
:root, [data-skin="midnight"] {
  --bg: #090D10; --fg: #F2F5F4; --muted: rgba(242,245,244,.64);
  --card: rgba(255,255,255,.06); --card-line: rgba(255,255,255,.12);
  --blur: 24px; --shadow: none; --inset: none;
  --accent: #8FE0D2; --on-accent: #06211D; --track: rgba(255,255,255,.12); --field: rgba(255,255,255,.07);
  --orb1: rgba(42,160,150,.55); --orb2: rgba(70,120,190,.42); --orb3: rgba(225,190,160,.16);
  --radius: 20px; --font: 'Manrope', system-ui, sans-serif; --label-font: 'Manrope', system-ui, sans-serif;
  --label-case: none; --label-track: .02em;
  color-scheme: dark;
}
[data-skin="ember"] {
  --bg: #F6F0EA; --fg: #2A1F1B; --muted: #75655D;
  --card: #F6F0EA; --card-line: rgba(255,255,255,.6);
  --blur: 0px; --shadow: 7px 7px 16px rgba(190,150,128,.30), -7px -7px 16px rgba(255,255,255,.95);
  --inset: inset 3px 3px 7px rgba(190,150,128,.28), inset -3px -3px 7px rgba(255,255,255,.9);
  --accent: #C4573A; --on-accent: #FFF8F3; --track: #F6F0EA; --field: #F6F0EA;
  --orb1: transparent; --orb2: transparent; --orb3: transparent;
  --radius: 22px; --label-case: uppercase; --label-track: .14em;
  color-scheme: light;
}
[data-skin="calm"] {
  --bg: #F4EFE8; --fg: #1D2A24; --muted: #5F6A62;
  --card: #F4EFE8; --card-line: rgba(255,255,255,.6);
  --blur: 0px; --shadow: 6px 6px 14px rgba(190,176,156,.38), -6px -6px 14px rgba(255,255,255,.9);
  --inset: inset 3px 3px 7px rgba(190,176,156,.34), inset -3px -3px 7px rgba(255,255,255,.9);
  --accent: #5B7562; --on-accent: #F7F3EC; --track: #F4EFE8; --field: #F4EFE8;
  --orb1: transparent; --orb2: transparent; --orb3: transparent;
  --radius: 22px; --label-case: uppercase; --label-track: .16em;
  color-scheme: light;
}
[data-skin="glass"] {
  --bg: #D9E4EE; --fg: #14212E; --muted: rgba(20,33,46,.64);
  --card: rgba(255,255,255,.46); --card-line: rgba(255,255,255,.75);
  --blur: 28px; --shadow: 0 8px 30px rgba(40,70,110,.12); --inset: none;
  --accent: #17749C; --on-accent: #FFFFFF; --track: rgba(20,33,46,.12); --field: rgba(255,255,255,.5);
  --orb1: rgba(120,190,230,.75); --orb2: rgba(150,220,215,.65); --orb3: rgba(255,255,255,.95);
  --radius: 22px; color-scheme: light;
}
[data-skin="neo"] {
  --bg: #0C1118; --fg: #EAF0F8; --muted: rgba(234,240,248,.62);
  --card: rgba(255,255,255,.07); --card-line: rgba(160,190,255,.18);
  --blur: 22px; --shadow: 0 10px 30px rgba(0,0,0,.35); --inset: none;
  --accent: #6C98FF; --on-accent: #07122B; --track: rgba(255,255,255,.12); --field: rgba(255,255,255,.07);
  --orb1: rgba(60,110,230,.38); --orb2: rgba(80,200,230,.2); --orb3: rgba(255,255,255,.06);
  --radius: 22px; color-scheme: dark;
}
[data-skin="forest"] {
  --bg: #0F1A15; --fg: #E8F0E6; --muted: rgba(232,240,230,.64);
  --card: rgba(255,255,255,.06); --card-line: rgba(200,230,190,.16);
  --blur: 24px; --shadow: none; --inset: none;
  --accent: #B9D08F; --on-accent: #13200F; --track: rgba(255,255,255,.12); --field: rgba(255,255,255,.07);
  --orb1: rgba(60,120,80,.5); --orb2: rgba(30,90,70,.5); --orb3: rgba(185,208,143,.12);
  --radius: 20px; color-scheme: dark;
}
[data-skin="ember-night"] {
  --bg: #100B08; --fg: #F6EEE8; --muted: rgba(246,238,232,.64);
  --card: rgba(255,255,255,.05); --card-line: rgba(255,200,150,.15);
  --blur: 24px; --shadow: none; --inset: none;
  --accent: #F59A2B; --on-accent: #2A1704; --track: rgba(255,255,255,.12); --field: rgba(255,255,255,.06);
  --orb1: rgba(230,110,30,.38); --orb2: rgba(160,60,20,.32); --orb3: rgba(255,170,80,.12);
  --radius: 20px; color-scheme: dark;
}
[data-skin="mono"] {
  --bg: #E9E9E9; --fg: #0E0E0E; --muted: rgba(14,14,14,.6);
  --card: rgba(255,255,255,.62); --card-line: rgba(255,255,255,.85);
  --blur: 26px; --shadow: 0 6px 24px rgba(0,0,0,.07); --inset: none;
  --accent: #0E0E0E; --on-accent: #F5F5F5; --track: rgba(0,0,0,.1); --field: rgba(255,255,255,.7);
  --orb1: rgba(255,255,255,.95); --orb2: rgba(190,190,190,.6); --orb3: rgba(255,255,255,.8);
  --radius: 22px; color-scheme: light;
}
[data-skin="mochi"] {
  --bg: #F6F4EE; --fg: #111111; --muted: #6A665E;
  --card: #F6F4EE; --card-line: #BEB8AD;
  --blur: 0px; --shadow: none; --inset: none;
  --accent: #111111; --on-accent: #F6F4EE; --track: #E6E1D7; --field: #EFEBE2;
  --orb1: transparent; --orb2: transparent; --orb3: transparent;
  --radius: 6px; --label-font: 'DM Mono', ui-monospace, monospace; --label-case: uppercase; --label-track: .12em;
  color-scheme: light;
}

[hidden] { display: none !important; }
html { min-height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .3s ease, color .3s ease;
  -webkit-tap-highlight-color: transparent;
}
.orbs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.orbs i { position: absolute; border-radius: 50%; filter: blur(80px); }
.orbs i:nth-child(1) { width: 300px; height: 300px; right: -90px; top: -70px; background: var(--orb1); }
.orbs i:nth-child(2) { width: 320px; height: 320px; left: -120px; top: 52%; background: var(--orb2); }
.orbs i:nth-child(3) { width: 260px; height: 260px; right: -70px; bottom: -50px; background: var(--orb3); }
.app { position: relative; z-index: 1; max-width: 430px; margin: 0 auto; padding-block: 20px 124px; }

h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.eyebrow { font: 500 12px/1.3 var(--label-font); text-transform: var(--label-case); letter-spacing: var(--label-track); color: var(--muted); }
.muted { color: var(--muted); }

.card {
  background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius);
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
}
.pad { padding: 16px 18px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.greet { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; text-wrap: balance; }
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none;
  background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
}
.icon-btn.warn { width: auto; padding: 0 14px; border-radius: 22px; font-size: 13px; font-weight: 600; }
button:active { transform: scale(.98); }

.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; color: var(--muted); }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; outline: none; }
.search input::placeholder { color: var(--muted); }

.today { display: flex; align-items: stretch; gap: 18px; }
.today > div { flex: 1; min-width: 0; }
.today .div { flex: none; width: 1px; background: var(--card-line); }
.big { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: var(--track); box-shadow: var(--inset); margin-top: 12px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
.sec h2 { font-size: 15px; font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { min-height: 104px; padding: 14px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-width: 0; }
.tile .i { width: 24px; height: 24px; color: var(--accent); }
.tile .t { display: block; font-weight: 600; font-size: 15px; }
.tile .s { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.link { display: block; margin: 0 auto; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; padding: 8px 12px; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; }
.row .chip { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--field); box-shadow: var(--inset); color: var(--accent); flex: none; }
.row .txt { flex: 1; min-width: 0; text-align: left; }
.row .nm { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 12.5px; color: var(--muted); }
.row.btn { width: 100%; }
.pill { font: 500 11px/1 var(--label-font); text-transform: var(--label-case); letter-spacing: var(--label-track); color: var(--muted); border: 1px solid var(--card-line); border-radius: 999px; padding: 6px 10px; flex: none; }

.check { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; display: grid; place-items: center; flex: none; padding: 0; color: var(--on-accent); }
.check.on { background: var(--accent); border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 12px; text-align: center; }
.day .l { font: 500 11px/1 var(--label-font); text-transform: var(--label-case); color: var(--muted); }
.day .c { width: 36px; height: 36px; margin: 8px auto 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 1.5px solid transparent; font-variant-numeric: tabular-nums; }
.day .c.part { border-color: var(--accent); }
.day .c.full { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.day .c.today { box-shadow: 0 0 0 3px var(--card-line); }
.day .c.future { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.form { display: flex; gap: 10px; }
.field { flex: 1; min-width: 0; height: 48px; border-radius: 24px; border: 1px solid var(--card-line); background: var(--field); box-shadow: var(--inset); color: var(--fg); font: inherit; padding: 0 16px; outline: none; }
.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field::placeholder { color: var(--muted); }
.add { height: 48px; border-radius: 24px; padding: 0 20px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.err { font-size: 13px; color: var(--fg); padding-left: 16px; }
.empty { text-align: center; padding: 28px 18px; }
.empty h2 { font-size: 17px; font-weight: 600; }
.empty p { color: var(--muted); margin-top: 6px; }

.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px; margin-top: 14px; }
.bars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; }
.bars b { display: block; width: 100%; max-width: 28px; min-height: 3px; border-radius: 6px; background: var(--accent); }
.bars span { font: 500 11px/1 var(--label-font); text-transform: var(--label-case); color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.skins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.skin { text-align: left; padding: 10px; border-radius: 18px; border: 1px solid var(--card-line); background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.skin[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.mini { border-radius: 12px; border: 1px solid var(--card-line); background: var(--card); box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 6px; height: 64px; justify-content: space-between; }
.mini i { display: block; height: 5px; border-radius: 3px; background: var(--fg); width: 60%; }
.mini i + i { background: var(--muted); width: 40%; }
.mini u { display: block; height: 8px; width: 38%; border-radius: 4px; background: var(--accent); }
.skin .n { font-weight: 600; font-size: 14px; }
.skin .d { font-size: 12px; color: var(--muted); }

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 36px 20px; }
.hero .chip { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--field); box-shadow: var(--inset); color: var(--accent); }
.hero .chip .i { width: 30px; height: 30px; }
.hero h2 { font-size: 20px; font-weight: 600; }
.hero p { color: var(--muted); max-width: 30ch; }

.nav {
  position: fixed; z-index: 5; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 398px; margin: 0 auto; height: 64px; border-radius: 32px; padding: 0 10px;
  display: flex; align-items: center; justify-content: space-around;
  background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(calc(var(--blur) + 8px)); backdrop-filter: blur(calc(var(--blur) + 8px));
}
.nav button { width: 52px; height: 48px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); border-radius: 24px; padding: 0; }
.nav button.on { color: var(--accent); }
.nav .plus { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: var(--on-accent); }

.view { animation: rise .25s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><path d="M13.5 6.5h.01"/><path d="M17.5 10.5h.01"/><path d="M6.5 12.5h.01"/><path d="M8.5 7.5h.01"/></symbol>
</defs>
</svg>

<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app" id="app">
  <section class="view stack" id="v-home" hidden></section>
  <section class="view stack" id="v-tools" hidden></section>
  <section class="view stack" id="v-habits" hidden></section>
  <section class="view stack" id="v-stats" hidden></section>
  <section class="view stack" id="v-look" hidden></section>
  <section class="view stack" id="v-soon" hidden></section>
</main>

<nav class="nav" aria-label="Main">
  <button id="n-home" data-act="go" data-to="home" aria-label="Home"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg></button>
  <button id="n-tools" data-act="go" data-to="tools" aria-label="All tools"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg></button>
  <button class="plus" data-act="quick" aria-label="Add a habit"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
  <button id="n-stats" data-act="go" data-to="stats" aria-label="Stats"><svg class="i" aria-hidden="true"><use href="#i-bars"/></svg></button>
</nav>

<iframe id="intro" title="Velentis intro" src="about:blank" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1000;background:#0A0A0B;transition:opacity .5s ease"></iframe>

<script>
(function () {
  var KEY = 'velentis.habits.v1', SKIN_KEY = 'velentis.skin';
  var SKINS = [
    ['midnight', 'Midnight', 'Dark frosted glass'],
    ['ember', 'Ember', 'Warm soft clay'],
    ['calm', 'Calm', 'Sage and sand'],
    ['glass', 'Glass', 'Light liquid glass'],
    ['neo', 'Neo', 'Slate with blue glow'],
    ['forest', 'Forest', 'Deep green glass'],
    ['ember-night', 'Ember night', 'Dark amber glass'],
    ['mono', 'Mono', 'Black and white glass'],
    ['mochi', 'Mochi', 'Flat paper and ink']
  ];
  var TOOLS = [
    { k: 'chef', n: 'Fridge chef', d: 'Recipes from what you have', i: 'chef' },
    { k: 'lang', n: 'Language buddy', d: 'Practice a little every day', i: 'lang' },
    { k: 'story', n: 'Text adventure', d: 'A story that reacts to you', i: 'compass' },
    { k: 'habits', n: 'Habit tracker', d: 'Check off your day', i: 'check', built: true },
    { k: 'spend', n: 'Expense notebook', d: 'See where your money goes', i: 'wallet' },
    { k: 'cards', n: 'Flashcards', d: 'Turn notes into quiz cards', i: 'layers' },
    { k: 'notes', n: 'Notes vault', d: 'Keep ideas in one place', i: 'notes' },
    { k: 'plan', n: 'Daily planner', d: 'Plan your day', i: 'list' },
    { k: 'focus', n: 'Focus timer', d: 'Study in focused rounds', i: 'timer' },
    { k: 'mood', n: 'Mood journal', d: 'A few lines a day', i: 'smile' },
    { k: 'quiz', n: 'Quiz game', d: 'Test what you know', i: 'help' },
    { k: 'move', n: 'Workout log', d: 'Log sets and streaks', i: 'activity' },
    { k: 'watch', n: 'Watchlist', d: 'Anime, songs, and books', i: 'play' },
    { k: 'write', n: 'Story and poem helper', d: 'Get unstuck and write', i: 'pen' },
    { k: 'facts', n: 'Myths and facts', d: 'Explore how things work', i: 'globe' },
    { k: 'count', n: 'Countdown board', d: 'Exams, birthdays, events', i: 'calendar' },
    { k: 'voice', n: 'Voice memos', d: 'Capture ideas by talking', i: 'mic' }
  ];
  var HOME_TILES = ['chef', 'lang', 'story', 'habits', 'spend', 'cards'];
  var VIEWS = ['home', 'tools', 'habits', 'stats', 'look', 'soon'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ic(n) { return '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function toolByKey(k) { return TOOLS.filter(function (t) { return t.k === k; })[0]; }

  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }

  function seed() {
    var t = new Date();
    function days(list) { return list.map(function (n) { return iso(addDays(t, -n)); }); }
    return { sample: true, habits: [
      { id: 'h1', name: 'Drink 8 glasses of water', days: days([0, 1, 2, 3, 4]) },
      { id: 'h2', name: 'Read 10 pages', days: days([0, 1, 2]) },
      { id: 'h3', name: 'Walk outside', days: days([1, 2, 3]) },
      { id: 'h4', name: 'Revise flashcards', days: days([1]) }
    ] };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); if (o && Array.isArray(o.habits)) return o; }
    } catch (e) {}
    return seed();
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function applySkin(id) {
    if (!SKINS.some(function (s) { return s[0] === id; })) id = 'midnight';
    document.documentElement.setAttribute('data-skin', id);
    return id;
  }
  var skin = 'midnight';
  try { skin = localStorage.getItem(SKIN_KEY) || 'midnight'; } catch (e) {}
  skin = applySkin(skin);

  function has(h, d) { return h.days.indexOf(d) !== -1; }
  function streak(h) {
    var d = new Date();
    if (!has(h, iso(d))) d = addDays(d, -1);
    var n = 0;
    while (has(h, iso(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function doneToday() { var t = iso(new Date()); return S.habits.filter(function (h) { return has(h, t); }).length; }
  function bestStreak() { return S.habits.reduce(function (m, h) { return Math.max(m, streak(h)); }, 0); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  var current = 'home', stub = null, pendingDel = null, focusAdd = false;

  function tileHTML(t) {
    var sub = t.k === 'habits' ? (bestStreak() > 0 ? plural(bestStreak(), 'day') + ' streak' : 'Start a streak') : t.d;
    return '<button class="card tile" data-act="open" data-k="' + t.k + '">' + ic(t.i) +
      '<span><span class="t">' + esc(t.n) + '</span><span class="s">' + esc(sub) + '</span></span></button>';
  }

  function renderHome() {
    var now = new Date(), h = now.getHours();
    var greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    var date = now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    var m = S.habits.length, n = doneToday(), pct = m ? Math.round(n / m * 100) : 0;
    var today = m
      ? '<div><div class="eyebrow">Habits today</div><div class="big">' + n + ' of ' + m + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="div"></div><div><div class="eyebrow">Best streak</div><div class="big">' + plural(bestStreak(), 'day') + '</div><p class="note" style="margin-top:12px">Keep it going</p></div>'
      : '<div><div class="eyebrow">Habits today</div><div class="big">No habits yet</div><p class="note" style="margin-top:8px">Add your first one to start a streak.</p></div>';
    $('v-home').innerHTML =
      '<header class="head"><div><div class="eyebrow">' + esc(date) + '</div><h1 class="greet">' + greet + '</h1></div>' +
      '<button class="icon-btn" data-act="go" data-to="look" aria-label="Change look">' + ic('palette') + '</button></header>' +
      '<label class="card search" for="q">' + ic('search') + '<input id="q" type="search" placeholder="Search tools and habits" autocomplete="off"></label>' +
      '<div id="searchOut" class="stack" hidden></div>' +
      '<div id="homeBody" class="stack">' +
      '<div class="card pad today">' + today + '</div>' +
      '<div class="sec"><h2>Your tools</h2><span class="eyebrow">6 of 17</span></div>' +
      '<div class="grid">' + HOME_TILES.map(function (k) { return tileHTML(toolByKey(k)); }).join('') + '</div>' +
      '<button class="link" data-act="go" data-to="tools">See all 17 tools</button></div>';
  }

  function rowTool(t) {
    return '<button class="card row btn" data-act="open" data-k="' + t.k + '"><span class="chip">' + ic(t.i) + '</span>' +
      '<span class="txt"><span class="nm">' + esc(t.n) + '</span><br><span class="sub">' + esc(t.d) + '</span></span>' +
      (t.built ? ic('chev') : '<span class="pill">Soon</span>') + '</button>';
  }
  function renderTools() {
    var ready = TOOLS.filter(function (t) { return t.built; }), soon = TOOLS.filter(function (t) { return !t.built; });
    $('v-tools').innerHTML =
      '<div class="topbar"><button class="icon-btn" data-act="go" data-to="home" aria-label="Back">' + ic('back') + '</button><h1>All tools</h1></div>' +
      '<div class="eyebrow">Ready to use</div><div class="list">' + ready.map(rowTool).join('') + '</div>' +
      '<div class="eyebrow" style="margin-top:6px">Coming next</div><div class="list">' + soon.map(rowTool).join('') + '</div>';
  }

  function renderHabits() {
    var t = new Date(), td = iso(t), dow = (t.getDay() + 6) % 7, mon = addDays(t, -dow);
    var letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'], total = S.habits.length, cells = '';
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), key = iso(d), c = S.habits.filter(function (h) { return has(h, key); }).length;
      var cls = 'c' + (total && c === total ? ' full' : c > 0 ? ' part' : '') + (key === td ? ' today' : '') + (key > td ? ' future' : '');
      cells += '<div class="day"><div class="l">' + letters[i] + '</div><div class="c ' + cls.slice(2) + '">' + d.getDate() + '</div></div>';
    }
    var rows = S.habits.map(function (h) {
      var done = has(h, td), s = streak(h), pend = pendingDel === h.id;
      return '<li class="card row"><button class="check' + (done ? ' on' : '') + '" data-act="toggle" data-id="' + h.id + '" aria-pressed="' + done + '" aria-label="Mark ' + esc(h.name) + ' done today">' + (done ? ic('tick') : '') + '</button>' +
        '<div class="txt"><div class="nm">' + esc(h.name) + '</div><div class="sub">' + (s > 0 ? plural(s, 'day') + ' streak' : 'No streak yet') + '</div></div>' +
        '<button class="icon-btn' + (pend ? ' warn' : '') + '" data-act="del" data-id="' + h.id + '" aria-label="Delete ' + esc(h.name) + '">' + (pend ? 'Delete?' : ic('trash')) + '</button></li>';
    }).join('');
    var empty = '<div class="card empty"><h2>Start your first habit</h2><p>Type a habit below and check it off each day.</p></div>';
    $('v-habits').innerHTML =
      '<div class="topbar"><button class="icon-btn" data-act="go" data-to="home" aria-label="Back">' + ic('back') + '</button><h1>Habit tracker</h1></div>' +
      '<div class="card pad"><div class="eyebrow">This week</div><div class="week">' + cells + '</div></div>' +
      (S.sample ? '<p class="note">These are example habits. Delete them or add your own.</p>' : '') +
      (total ? '<ul class="list">' + rows + '</ul>' : empty) +
      '<form class="stack" id="addForm" novalidate style="gap:6px"><div class="form"><input class="field" id="habitName" maxlength="40" placeholder="New habit, like Stretch for 5 minutes" aria-label="New habit name" autocomplete="off"><button class="add" type="submit">Add</button></div><div class="err" id="addErr" hidden>Type a habit name first.</div></form>';
    if (focusAdd) { focusAdd = false; var f = $('habitName'); if (f) f.focus(); }
  }

  function renderStats() {
    var t = new Date(), total = S.habits.length, vals = [], sum = 0, bars = '';
    var letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    for (var i = 6; i >= 0; i--) {
      var d = addDays(t, -i), key = iso(d), c = S.habits.filter(function (h) { return has(h, key); }).length;
      var p = total ? c / total : 0; sum += p;
      bars += '<div><b style="height:' + Math.max(3, Math.round(p * 84)) + 'px" title="' + Math.round(p * 100) + '%"></b><span>' + letters[d.getDay()] + '</span></div>';
    }
    var avg = total ? Math.round(sum / 7 * 100) : 0;
    $('v-stats').innerHTML =
      '<div class="topbar"><button class="icon-btn" data-act="go" data-to="home" aria-label="Back">' + ic('back') + '</button><h1>Stats</h1></div>' +
      '<div class="metrics"><div class="card pad"><div class="eyebrow">Habits</div><div class="big">' + total + '</div></div>' +
      '<div class="card pad"><div class="eyebrow">Best streak</div><div class="big">' + plural(bestStreak(), 'day') + '</div></div></div>' +
      '<div class="card pad"><div class="eyebrow">Last 7 days</div><div class="big">' + avg + '% done</div><div class="bars" role="img" aria-label="Habits completed each of the last 7 days">' + bars + '</div></div>' +
      '<p class="note">More stats will show up here as you add more tools.</p>';
  }

  function renderLook() {
    $('v-look').innerHTML =
      '<div class="topbar"><button class="icon-btn" data-act="go" data-to="home" aria-label="Back">' + ic('back') + '</button><h1>Look</h1></div>' +
      '<p class="muted">Pick how Velentis feels. It changes the whole app and stays after you close it.</p>' +
      '<div class="skins">' + SKINS.map(function (s) {
        return '<button class="skin" data-skin="' + s[0] + '" data-act="skin" data-id="' + s[0] + '" aria-pressed="' + (s[0] === skin) + '">' +
          '<span class="mini"><i></i><i></i><u></u></span><span><span class="n">' + s[1] + '</span><br><span class="d">' + s[2] + '</span></span></button>';
      }).join('') + '</div>' +
      '<div class="list">' + introRows() + '</div>';
  }

  function introRows() {
    var on = introOn();
    return '<button class="card row btn" data-act="introPlay"><span class="chip">' + ic('play') + '</span><span class="txt"><span class="nm">Replay intro</span><br><span class="sub">Watch the logo animation again</span></span>' + ic('chev') + '</button>' +
      '<button class="card row btn" data-act="introToggle" aria-pressed="' + on + '"><span class="chip">' + ic('check') + '</span><span class="txt"><span class="nm">Intro on start</span><br><span class="sub">' + (on ? 'On. It plays each time you open Velentis.' : 'Off. Velentis opens straight to home.') + '</span></span><span class="pill">' + (on ? 'On' : 'Off') + '</span></button>';
  }

  function renderSoon() {
    var t = stub && toolByKey(stub);
    if (!t) { go('home'); return; }
    $('v-soon').innerHTML =
      '<div class="topbar"><button class="icon-btn" data-act="go" data-to="tools" aria-label="Back">' + ic('back') + '</button><h1>' + esc(t.n) + '</h1></div>' +
      '<div class="card hero"><span class="chip">' + ic(t.i) + '</span><h2>Coming soon</h2><p>' + esc(t.d) + '. We will build this one in a later step.</p></div>';
  }

  var renderers = { home: renderHome, tools: renderTools, habits: renderHabits, stats: renderStats, look: renderLook, soon: renderSoon };
  function show(name) {
    if (VIEWS.indexOf(name) === -1) name = 'home';
    if (name === 'soon' && !stub) name = 'home';
    current = name;
    renderers[name]();
    VIEWS.forEach(function (v) { $('v-' + v).hidden = v !== name; });
    ['home', 'tools', 'stats'].forEach(function (v) {
      var b = $('n-' + v); b.classList.toggle('on', v === name);
      if (v === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function go(name) {
    if (location.hash === '#' + name) { show(name); } else { location.hash = name; }
    window.scrollTo(0, 0);
  }
  function openTool(k) {
    if (k === 'habits') { go('habits'); return; }
    stub = k; go('soon');
  }

  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (a === 'go') go(t.getAttribute('data-to'));
    else if (a === 'open') openTool(t.getAttribute('data-k'));
    else if (a === 'quick') { focusAdd = true; if (current === 'habits') { renderHabits(); } else { go('habits'); } }
    else if (a === 'toggle') {
      var h = S.habits.filter(function (x) { return x.id === id; })[0]; if (!h) return;
      var td = iso(new Date()), i = h.days.indexOf(td);
      if (i === -1) h.days.push(td); else h.days.splice(i, 1);
      save(); renderHabits();
    } else if (a === 'del') {
      if (pendingDel === id) {
        S.habits = S.habits.filter(function (x) { return x.id !== id; });
        S.sample = false; pendingDel = null; save(); renderHabits();
      } else {
        pendingDel = id; renderHabits();
        setTimeout(function () { if (pendingDel === id) { pendingDel = null; if (current === 'habits') renderHabits(); } }, 3000);
      }
    } else if (a === 'skin') {
      skin = applySkin(id);
      try { localStorage.setItem(SKIN_KEY, skin); } catch (err) {}
      renderLook();
    } else if (a === 'introPlay') {
      playIntro();
    } else if (a === 'introToggle') {
      try { localStorage.setItem('velentis.intro', introOn() ? 'off' : 'on'); } catch (err) {}
      renderLook();
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'addForm') return;
    e.preventDefault();
    var f = $('habitName'), name = f.value.trim();
    if (!name) { $('addErr').hidden = false; f.focus(); return; }
    S.habits.push({ id: 'h' + Date.now().toString(36) + Math.floor(Math.random() * 1000), name: name, days: [] });
    S.sample = false; save(); focusAdd = true; renderHabits();
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'habitName') { $('addErr').hidden = true; return; }
    if (e.target.id !== 'q') return;
    var q = e.target.value.trim().toLowerCase(), out = $('searchOut'), body = $('homeBody');
    if (!q) { out.hidden = true; body.hidden = false; return; }
    var rows = TOOLS.filter(function (t) { return (t.n + ' ' + t.d).toLowerCase().indexOf(q) !== -1; }).map(rowTool);
    S.habits.filter(function (h) { return h.name.toLowerCase().indexOf(q) !== -1; }).forEach(function (h) {
      rows.push('<button class="card row btn" data-act="go" data-to="habits"><span class="chip">' + ic('check') + '</span><span class="txt"><span class="nm">' + esc(h.name) + '</span><br><span class="sub">Habit</span></span>' + ic('chev') + '</button>');
    });
    out.innerHTML = rows.length ? '<div class="list">' + rows.join('') + '</div>' : '<p class="note">Nothing matches that yet.</p>';
    out.hidden = false; body.hidden = true;
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden && (current === 'home' || current === 'habits' || current === 'stats')) renderers[current](); });

  show(location.hash.slice(1) || 'home');

  var LIGHT_SKINS = ['ember', 'calm', 'glass', 'mono', 'mochi'];
  var introEl = $('intro'), introTimer = 0;
  function introOn() { try { return localStorage.getItem('velentis.intro') !== 'off'; } catch (e) { return true; } }
  function endIntro() {
    clearTimeout(introTimer);
    introEl.style.opacity = 0;
    setTimeout(function () { introEl.hidden = true; introEl.src = 'about:blank'; }, 600);
  }
  function playIntro() {
    var light = LIGHT_SKINS.indexOf(skin) !== -1;
    introEl.style.background = light ? '#F5F5F2' : '#0A0A0B';
    introEl.hidden = false;
    introEl.style.opacity = 1;
    introEl.src = 'intro.html?theme=' + (light ? 'light' : 'dark') + '&t=' + Date.now();
    clearTimeout(introTimer);
    introTimer = setTimeout(endIntro, 14000);
  }
  window.addEventListener('message', function (e) {
    if (e.source === introEl.contentWindow && e.data && e.data.type === 'velentis-intro-done') endIntro();
  });
  if (introOn()) playIntro(); else introEl.hidden = true;
})();
</script>
</body>
</html>
